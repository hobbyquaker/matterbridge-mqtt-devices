# Node.js CI (plugin) v. 2.0.2

name: Node.js CI

on:
  push:
    paths-ignore:
      - '**/*.md' # any .md anywhere
  pull_request:
    paths-ignore:
      - '**/*.md' # any .md anywhere
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Verify Node.js version
        run: node -v

      - name: Verify Npm version
        run: npm -v

      - name: Select matterbridge ref
        id: select_matterbridge_ref
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $line = git ls-remote --tags --refs --sort='-v:refname' https://github.com/Luligu/matterbridge.git 'refs/tags/v*' | Select-Object -First 1
            $ref = if ($line) { ($line -split '\s+')[1] -replace 'refs/tags/', '' } else { 'main' }
          } else {
            $ref = 'main'
          }
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Selected matterbridge ref: $ref"

      - name: Clone matterbridge at ${{ steps.select_matterbridge_ref.outputs.ref }}
        run: git clone --depth 1 --single-branch --no-tags -b ${{ steps.select_matterbridge_ref.outputs.ref }} https://github.com/Luligu/matterbridge.git ../matterbridge

      - name: Install matterbridge dependencies
        working-directory: ../matterbridge
        run: npm ci --no-fund --no-audit

      - name: Build matterbridge
        working-directory: ../matterbridge
        run: npm run build

      - name: Link matterbridge globally
        working-directory: ../matterbridge
        run: npm link --no-fund --no-audit

      - name: Install plugin dependencies
        run: npm ci --no-fund --no-audit

      - name: Link matterbridge in the project
        run: npm link matterbridge --no-fund --no-audit

      - name: Build the plugin
        run: npm run build

      - name: Lint the plugin
        run: npm run lint

      - name: Test the plugin
        run: npm run test -- --forceExit --testTimeout=30000
